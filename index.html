<style>
:root{
  --serif:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --sans:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --bg:#F4F3EE; --surface:#FFFFFF; --soft:#F1EFE8; --line:#E3E0D6; --line2:#CFCBBD;
  --ink:#1B2230; --ink2:#586174; --navy:#0D2250; --brand:#17449A;
  --btn:#0D2250; --btn-ink:#FFFFFF;
  --gold:#C99A1D; --goldbg:#F7EDCF; --goldink:#7C5A08;
  --ok:#1F6B50; --okbg:#E3EFE8; --prog:#8A6209; --progbg:#F7EDCF; --miss:#A1312C; --missbg:#F7E5E2;
  --bar-miss:#E4E1D7; --on-seg:#FFFFFF; --mast:#0D2250; --mast-ink:#FFFFFF; --mast-sub:#B9C5E1;
  --tR-bg:#E6ECF8; --tR:#2A4A8F; --tH-bg:#EEE8F5; --tH:#5B3A87; --tG-bg:#F7E6EE; --tG:#8F2B5C;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1326; --surface:#111D38; --soft:#16264A; --line:#233458; --line2:#2E4270;
    --ink:#E8ECF6; --ink2:#9EABC6; --navy:#DCE5FA; --brand:#86A8F2;
    --btn:#86A8F2; --btn-ink:#0A1326;
    --gold:#E2B13C; --goldbg:#3A2F10; --goldink:#EBC565;
    --ok:#5ACB9C; --okbg:#133528; --prog:#E8BC57; --progbg:#3A2F10; --miss:#F28B80; --missbg:#451E1B;
    --bar-miss:#223356; --on-seg:#0A1326; --mast:#0A1735; --mast-sub:#9FB0D6;
    --tR-bg:#22365E; --tR:#B7CDFF; --tH-bg:#3A2C55; --tH:#D9C6F5; --tG-bg:#55283F; --tG:#F5C5DB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1326; --surface:#111D38; --soft:#16264A; --line:#233458; --line2:#2E4270;
  --ink:#E8ECF6; --ink2:#9EABC6; --navy:#DCE5FA; --brand:#86A8F2;
  --btn:#86A8F2; --btn-ink:#0A1326;
  --gold:#E2B13C; --goldbg:#3A2F10; --goldink:#EBC565;
  --ok:#5ACB9C; --okbg:#133528; --prog:#E8BC57; --progbg:#3A2F10; --miss:#F28B80; --missbg:#451E1B;
  --bar-miss:#223356; --on-seg:#0A1326; --mast:#0A1735; --mast-sub:#9FB0D6;
  --tR-bg:#22365E; --tR:#B7CDFF; --tH-bg:#3A2C55; --tH:#D9C6F5; --tG-bg:#55283F; --tG:#F5C5DB;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%;text-size-adjust:100%;}
*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--mast);z-index:40;}
.num{font-variant-numeric:tabular-nums;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
.wrap{max-width:960px;margin:0 auto;padding:0 18px 48px;}

/* 머리글 */
.masthead{background:var(--mast);color:var(--mast-ink);border-bottom:3px solid var(--gold);}
.mast-in{max-width:960px;margin:0 auto;padding:18px 18px 17px;display:flex;align-items:center;gap:16px;}
.crest{width:60px;height:60px;border-radius:50%;background:#fff;flex:none;display:block;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.2);}
.eyebrow{font-size:12px;color:var(--gold);font-weight:600;letter-spacing:.02em;}
.masthead h1{margin:2px 0 0;font-family:var(--serif);font-size:26px;line-height:1.28;font-weight:700;color:var(--mast-ink);letter-spacing:-.01em;}
.masthead .sub{margin:5px 0 0;font-size:13.5px;color:var(--mast-sub);}
.intro{margin:18px 0 0;color:var(--ink2);font-size:14.5px;max-width:66ch;}

/* 상단 고정 바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line2);}
.bar-in{max-width:960px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;}
.bar .t{font-size:12.5px;color:var(--ink2);font-weight:500;}
.bar .big{font-family:var(--serif);font-size:27px;font-weight:700;line-height:1.1;color:var(--navy);letter-spacing:-.01em;}
.bar .big small{font-family:var(--sans);font-size:13px;font-weight:500;margin-left:3px;color:var(--ink2);letter-spacing:0;}
.bar .mini{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);}
.bar .mini b{color:var(--ink);font-weight:700;}
.bar .sp{flex:1;}
.chk{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink2);cursor:pointer;user-select:none;}
.chk input{width:20px;height:20px;accent-color:var(--navy);}
:root[data-theme="dark"] .chk input,:root[data-theme="dark"] .opt input,:root[data-theme="dark"] .ncl input{accent-color:var(--brand);}

/* 남은 학점 표 */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:16px;}
.warn{background:var(--progbg);color:var(--goldink);border-radius:8px;padding:10px 13px;font-size:14px;margin-bottom:16px;font-weight:500;}
.lg-top{display:flex;align-items:flex-end;gap:6px 20px;flex-wrap:wrap;margin-bottom:12px;}
.lg-top .n{font-family:var(--serif);font-size:64px;font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--navy);}
.lg-top .n small{font-family:var(--sans);font-size:17px;font-weight:500;color:var(--ink2);margin-left:6px;letter-spacing:0;}
.lg-top .d{color:var(--ink2);font-size:14px;padding-bottom:5px;line-height:1.6;}
.lg-top .d b{color:var(--ink);}
.lrow{display:grid;grid-template-columns:116px 1fr 150px;gap:6px 16px;align-items:center;padding:13px 0;border-top:1px solid var(--line);}
.lrow .nm{font-weight:700;font-size:15.5px;color:var(--navy);line-height:1.35;}
.lrow .nm small{display:block;font-weight:400;color:var(--ink2);font-size:12.5px;margin-top:2px;}
.track{height:7px;border-radius:4px;background:var(--bar-miss);display:flex;overflow:hidden;}
.track i{display:block;height:100%;}
.track .d{background:var(--ok);} .track .p{background:var(--gold);}
.lrow .rt{text-align:right;font-size:13px;color:var(--ink2);line-height:1.5;}
.lrow .rt b{font-family:var(--serif);font-size:21px;color:var(--navy);font-weight:700;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:10px;}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px;background:var(--bar-miss);}
.legend .ld::before{background:var(--ok);} .legend .lp::before{background:var(--gold);}
.plan{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;}
.plan label{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-weight:500;}
.plan input{width:68px;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-size:16px;min-height:42px;}
.plan .res{color:var(--ink2);}
.plan .res b{color:var(--ink);}
.plan .res.bad b{color:var(--miss);}

/* 검색 */
.search{margin-top:16px;}
.search input{width:100%;min-width:0;padding:13px 16px 13px 46px;border:1px solid var(--line2);border-radius:10px;background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%23808aa0" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>') no-repeat 15px 50%;font-size:16px;color:var(--ink);min-height:48px;-webkit-appearance:none;appearance:none;}
.search input::placeholder{color:#8A93A6;}
.search input:focus-visible{border-color:var(--brand);outline-offset:0;}

/* 탭 */
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin:20px 0 14px;border-bottom:1px solid var(--line2);scrollbar-width:none;-webkit-overflow-scrolling:touch;}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{flex:0 0 auto;border:0;background:none;padding:12px 14px;font-weight:600;font-size:15px;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:46px;}
nav.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--gold);}
nav.tabs .cnt{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--missbg);color:var(--miss);}
nav.tabs .cnt.z{background:var(--okbg);color:var(--ok);}

/* 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px;}
.card h2{margin:0 0 6px;font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.35;color:var(--navy);letter-spacing:-.01em;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;}
.card h2 .tg{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink2);letter-spacing:0;}
.card h3{margin:22px 0 6px;font-size:15.5px;font-weight:700;color:var(--ink);display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap;}
.card h3 .need{font-size:13px;font-weight:500;color:var(--ink2);}
.note{font-size:14px;color:var(--ink2);margin:6px 0 10px;max-width:72ch;line-height:1.65;}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink2);letter-spacing:0;}
.pill.ok{background:var(--okbg);color:var(--ok);} .pill.no{background:var(--missbg);color:var(--miss);} .pill.pg{background:var(--progbg);color:var(--goldink);}

/* 과목 줄 */
.crs{display:grid;grid-template-columns:1fr 54px auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);}
.crs .nm{font-size:15.5px;line-height:1.5;}
.crs .cr{font-size:13.5px;color:var(--ink2);text-align:right;}
.crs.s1 .nm{color:var(--ok);font-weight:600;}
.crs.s2 .nm{color:var(--prog);font-weight:600;}
.crs .cat{font-size:12.5px;color:var(--ink2);font-weight:400;margin-top:2px;line-height:1.5;}
.crs.s1 .nm .cat,.crs.s2 .nm .cat{color:var(--ink2);font-weight:400;}
.tag{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--ink2);vertical-align:1px;}
.tag.R{background:var(--tR-bg);color:var(--tR);} .tag.H{background:var(--tH-bg);color:var(--tH);} .tag.G{background:var(--tG-bg);color:var(--tG);}
.tag.new{background:var(--goldbg);color:var(--goldink);}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface);}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13.5px;font-weight:500;color:var(--ink2);border-left:1px solid var(--line);min-width:56px;min-height:38px;}
.seg button:first-child{border-left:0;}
.seg button[aria-pressed="true"][data-v="1"]{background:var(--ok);color:var(--on-seg);font-weight:700;}
.seg button[aria-pressed="true"][data-v="2"]{background:var(--prog);color:var(--on-seg);font-weight:700;}
.seg button[aria-pressed="true"][data-v="0"]{background:var(--soft);color:var(--ink);font-weight:700;}
.pickbox{border:1px dashed var(--line2);border-radius:8px;padding:2px 14px 4px;margin:10px 0;}
.pickbox .lab{font-size:13px;color:var(--ink2);margin-top:9px;font-weight:600;}
details.grp{border-top:1px solid var(--line);margin-top:12px;padding-top:8px;}
details.grp>summary{cursor:pointer;font-weight:700;font-size:15.5px;list-style:none;display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;padding:6px 0;min-height:40px;}
details.grp>summary::-webkit-details-marker{display:none;}
details.grp>summary::before{content:"▸";color:var(--gold);font-size:13px;width:14px;}
details.grp[open]>summary::before{content:"▾";}
.stp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;}
.stp .lb{min-width:130px;font-size:15px;}
.stp button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-size:19px;line-height:1;}
.stp .v{min-width:30px;text-align:center;font-weight:700;font-size:16px;}

/* 입력 */
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:10px;}
.fm label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2);font-weight:500;}
.fm input,.fm select,.inp{padding:10px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-size:16px;color:var(--ink);min-height:44px;}
textarea.inp{width:100%;min-height:96px;font-family:ui-monospace,Consolas,monospace;font-size:13px;}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14.5px;min-height:44px;}
.btn.ghost{background:transparent;color:var(--brand);border-color:var(--brand);}
.btn.danger{background:transparent;border-color:var(--miss);color:var(--miss);}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
.opt{display:inline-flex;align-items:center;gap:9px;padding:11px 15px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);cursor:pointer;font-size:15px;min-height:46px;}
.opt input{accent-color:var(--navy);width:18px;height:18px;margin:0;}
.opt.on{border-color:var(--navy);background:var(--soft);font-weight:700;}
:root[data-theme="dark"] .opt.on{border-color:var(--brand);}
.xl{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px;}
.xl .sub{font-size:13px;color:var(--ink2);}
.ncl{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);}
.ncl input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--navy);flex:none;}
.ncl .tt{font-weight:600;font-size:15.5px;}
.ncl .ss{font-size:13.5px;color:var(--ink2);line-height:1.6;}
ul.plain{margin:8px 0;padding-left:20px;} ul.plain li{margin:6px 0;font-size:14px;max-width:80ch;line-height:1.65;}
ul.bul{margin:8px 0 0;padding-left:20px;} ul.bul li{margin:4px 0;font-size:14px;line-height:1.65;}

/* 남은 과목 화면 */
.rem-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px;}
.rem-sum .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;}
.rem-sum .box.tot{background:var(--mast);border-color:var(--mast);}
.rem-sum .box.tot .k{color:var(--mast-sub);}
.rem-sum .box.tot .v{color:#fff;} .rem-sum .box.tot .v small{color:var(--mast-sub);}
.rem-sum .k{font-size:13px;color:var(--ink2);font-weight:500;}
.rem-sum .v{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.02em;color:var(--navy);}
.rem-sum .v small{font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--ink2);margin-left:3px;letter-spacing:0;}
.rem-sum .v.z{color:var(--ok);}
.rem-sum .box.tot .v.z{color:#8FE0BC;}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap;}
.rc-h h2{margin:0;font-size:20px;}
.rc-n{font-size:14px;color:var(--ink2);}
.rc-n b{font-family:var(--serif);font-size:28px;color:var(--miss);font-weight:700;margin:0 3px;}
.rc-n.z b{color:var(--ok);font-size:22px;}
.rg{border-top:1px solid var(--line2);margin-top:16px;padding-top:12px;}
.rg-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px;}
.rg-h .t{font-weight:700;font-size:16px;color:var(--ink);}
.rg-h .s{font-size:14px;font-weight:700;color:var(--miss);}
.rr{display:grid;grid-template-columns:64px 1fr auto;gap:2px 12px;align-items:start;padding:11px 0;border-top:1px solid var(--line);}
.rg-h + .rr{border-top:0;}
.rr .tg{display:inline-block;text-align:center;font-size:12.5px;font-weight:700;padding:3px 0;border-radius:6px;background:var(--soft);color:var(--ink2);}
.rr .tg.req{background:var(--missbg);color:var(--miss);}
.rr .tg.pk{background:var(--progbg);color:var(--goldink);}
.rr .tg.ok{background:var(--okbg);color:var(--ok);}
.rr .nm{font-size:15.5px;font-weight:600;line-height:1.5;}
.rr .nt{font-size:13.5px;color:var(--ink2);margin-top:2px;line-height:1.55;}
.rr .cr{font-weight:700;font-size:15.5px;white-space:nowrap;text-align:right;}
.rr .cr.neg{color:var(--ok);}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink2);border:1px solid var(--line);}
details.cand{margin-top:8px;}
details.cand>summary{cursor:pointer;font-size:13.5px;color:var(--brand);font-weight:600;min-height:32px;}
.done-msg{padding:13px;border-radius:8px;background:var(--okbg);color:var(--ok);font-weight:600;font-size:14.5px;margin-top:10px;}
.tkpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
.tkpick .opt{width:100%;align-items:flex-start;}
.tkpick .opt small{display:block;font-weight:400;color:var(--ink2);font-size:13px;}
mark{background:var(--goldbg);color:var(--goldink);border-radius:3px;padding:0 2px;}
.qf{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.qf button{border:1px solid var(--line2);background:var(--surface);padding:7px 15px;border-radius:999px;font-size:14px;color:var(--ink2);min-height:40px;}
.qf button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-weight:700;}
.sh{font-size:13.5px;font-weight:700;color:var(--ink2);margin:16px 0 2px;}

/* 맨 아래 */
.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--line2);font-size:13px;color:var(--ink2);line-height:1.7;}
.foot p{margin:0;}
.foot .credit{margin-top:12px;font-weight:600;color:var(--ink);letter-spacing:.01em;}

/* 휴대폰 */
@media (max-width:640px){
  .wrap{padding:0 14px 40px;}
  .mast-in{padding:15px 14px 14px;gap:13px;}
  .crest{width:52px;height:52px;}
  .masthead h1{font-size:21px;}
  .masthead .sub{font-size:13px;}
  .intro{font-size:14px;margin-top:14px;}
  .bar-in{padding:8px 14px;}
  .bar .big{font-size:25px;}
  .bar .mini{display:none;}
  .ledger{padding:16px;}
  .lg-top .n{font-size:52px;}
  .lg-top .n small{font-size:15px;}
  .lrow{grid-template-columns:1fr;gap:5px;padding:13px 0;}
  .lrow .rt{text-align:left;}
  .card{padding:15px;}
  .card h2{font-size:18px;}
  .crs{grid-template-columns:1fr;gap:9px;padding:13px 0;}
  .crs .cr{display:none;}
  .crs .nm .c{display:inline;margin-left:8px;font-size:13px;color:var(--ink2);font-weight:400;}
  .seg{display:flex;width:100%;}
  .seg button{flex:1;min-height:44px;font-size:15px;min-width:0;}
  .xl{grid-template-columns:1fr;}
  .rem-sum{grid-template-columns:1fr 1fr;}
  .rem-sum .box.tot{grid-column:1/-1;}
  .rr{grid-template-columns:54px 1fr auto;gap:2px 10px;}
  .tkpick{grid-template-columns:1fr;}
  nav.tabs button{padding:12px 13px;}
  .opt{flex:1 1 auto;}
}
@media (min-width:641px){ .crs .nm .c{display:none;} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
</style>

/* ============================================================
   계산 (편입생: 교양 4 + 일반학전공 42 + 경찰학전공 36 + 부호지정 H/G 2 = 84학점)
   ============================================================ */
function compute(S,inc){
  const cnt=function(id){const v=S.st[id]|0;return v===1||(inc&&v===2);};
  const sumIds=function(ids){return ids.reduce(function(a,id){return a+(cnt(id)?C[id].cr:0);},0);};
  const G={gy:[],ma:[],po:[],hg:[],adv:[],tk:[]};
  const grp=function(area,title){const g={t:title,rem:0,rows:[]};G[area].push(g);return g;};
  const row=function(g,n,cr,tag,extra){const o={n:n,cr:cr,tag:tag||''};if(extra)Object.assign(o,extra);g.rows.push(o);};
  const missOpts=function(ids){return ids.filter(function(id){return !cnt(id);}).map(function(id){return {n:C[id].name,cr:C[id].cr};});};

  /* 직접 입력한 인정학점 */
  const xs={};let codeGy=0,codeSel=0;
  S.extras.forEach(function(e){
    const v=e.status|0;if(!(v===1||(inc&&v===2)))return;
    const c=Math.max(0,+e.cr||0);
    xs[e.bucket]=(xs[e.bucket]||0)+c;
    if(e.code==='H'||e.code==='G'){if(e.bucket==='gy_x')codeGy+=c;else codeSel+=c;}
  });

  /* ---------- 교양 4학점 ---------- */
  const gHum=grp('gy','인성교양 · 신체적 체험(무도)');
  const gyRem=Math.max(0,4-sumIds(HUM_MUDO));
  HUM_MUDO.forEach(function(id){if(!cnt(id))row(gHum,C[id].name,1,'필수');});
  gHum.rem=gyRem;

  /* ---------- 일반학전공 42학점 ---------- */
  const dept=S.dept;
  const own=(S.track&&TR[S.track]&&TR[S.track].dept===dept)?S.track:Object.keys(TR).filter(function(k){return TR[k].dept===dept;})[0];
  const gB=grp('ma','전공기초 (17학점)'),gR=grp('ma','전공필수 (19학점)'),gS=grp('ma','전공선택 (6학점)');
  const comOk=MA_COM.some(cnt),civOk=MA_CIV.some(cnt);
  const maBaseMiss=MA_BASE.reduce(function(s,id){return s+(cnt(id)?0:C[id].cr);},0)+(comOk?0:2)+(civOk?0:3);
  MA_BASE.forEach(function(id){if(!cnt(id))row(gB,C[id].name,C[id].cr,'필수');});
  if(!comOk)row(gB,'법학개론·행정이론세미나·경찰학개론 중 1과목',2,'택1',{note:'공통 기초',opts:missOpts(MA_COM)});
  if(!civOk)row(gB,'경찰민법Ⅰ 또는 민법총칙',3,'택1',{opts:missOpts(MA_CIV)});
  const rq=REQ[dept];
  const rqPickOk=!rq.pick.length||rq.pick.some(cnt);
  const rqMiss=rq.fixed.reduce(function(s,id){return s+(cnt(id)?0:C[id].cr);},0)+(rqPickOk?0:3);
  rq.fixed.forEach(function(id){if(!cnt(id))row(gR,C[id].name,C[id].cr,'필수');});
  if(!rqPickOk)row(gR,rq.pickLabel,3,'택1',{opts:missOpts(rq.pick)});
  gB.rem=maBaseMiss;gR.rem=rqMiss;

  /* 전공선택 */
  const excl=EXCL[dept];
  const otherDept=dept==='law'?'admin':'law';
  const sameOther=Object.keys(TR).filter(function(k){return k!==own&&TR[k].dept===dept;})[0];
  const otherTracks=Object.keys(TR).filter(function(k){return TR[k].dept!==dept;});
  const listIds=function(t){return LIST[t].map(function(_,i){return t+'_'+i;}).filter(function(id){return excl.indexOf(id)<0;});};
  const trackC=function(t){return sumIds(listIds(t));};
  const semC=function(t){return sumIds([t+'_s1',t+'_s2']);};
  const minorExtra=REQ[otherDept].fixed.concat(REQ[otherDept].pick).filter(function(id){return !LISTSET[id];});
  const thC=sumIds(TH);
  const mTh=(cnt('th1')?0:1)+(cnt('th2')?0:1);
  const tkrAdv=(S.adv==='track'&&S.tkId&&TRK[S.tkId])?trackCalc(cnt,dept,minorExtra):null;

  const calcSel=function(adv){
    const rows=[];
    const ownC=trackC(own)+semC(own)+thC+(xs.ma_own||0);
    const sameC=trackC(sameOther)+semC(sameOther)+(xs.ma_same||0);
    const otherC=otherTracks.reduce(function(a,t){return a+trackC(t)+semC(t);},0)+(adv==='minor'?sumIds(minorExtra):0)+(xs.ma_other||0);
    const tkExtra=(adv==='track'&&tkrAdv)?tkrAdv.extra:0;
    const total=ownC+sameC+otherC+tkExtra;
    const advDiff=adv==='major'&&S.advTrack!==own&&TR[S.advTrack]&&TR[S.advTrack].dept===dept;
    const advT=advDiff?S.advTrack:null;
    const advPoolC=advDiff?(S.advTrack===sameOther?sameC:0):0;
    const needOwn=adv!=='none';
    const mSemOwn=needOwn?((cnt(own+'_s1')?0:2)+(cnt(own+'_s2')?0:2)):0;
    const mSemAdv=advDiff?((cnt(advT+'_s1')?0:2)+(cnt(advT+'_s2')?0:2)):0;
    const ownReq=adv==='none'?0:((adv==='major'&&!advDiff)?20:8);
    const T=adv==='none'?6:20;
    const yOwn=needOwn?Math.max(0,ownReq-ownC-mSemOwn-mTh):0;
    const yAdv=advDiff?Math.max(0,12-advPoolC-mSemAdv):0;
    const yOther=adv==='minor'?Math.max(0,12-otherC):0;
    const after=total+mSemOwn+mSemAdv+mTh+yOwn+yAdv+yOther;
    const yAny=Math.max(0,T-after);
    if(needOwn)[1,2].forEach(function(n){if(!cnt(own+'_s'+n))rows.push({n:SEM_NAME[own]+' '+(n===1?'Ⅰ':'Ⅱ'),cr:2,tag:'필수',note:'소속 전공과정 전공심화세미나'});});
    if(advDiff)[1,2].forEach(function(n){if(!cnt(advT+'_s'+n))rows.push({n:SEM_NAME[advT]+' '+(n===1?'Ⅰ':'Ⅱ'),cr:2,tag:'필수',note:'심화전공 세미나'});});
    [['th1','Ⅰ'],['th2','Ⅱ']].forEach(function(x){if(!cnt(x[0]))rows.push({n:'논문활동 '+x[1],cr:1,tag:'졸업요건',note:'4학년 · 전공선택 학점으로 인정'});});
    if(yOwn>0)rows.push({n:'소속 전공과정('+TR[own].name+') 전공선택',cr:yOwn,tag:'선택',note:ownReq===20?'심화전공: 8학점 + 심화 12학점':'소속 전공과정에서 8학점 이상 필요',opts:listIds(own).filter(function(id){return !cnt(id);}).map(function(id){return {n:C[id].name,cr:C[id].cr};})});
    if(yAdv>0)rows.push({n:'심화전공('+(advT?TR[advT].name:'')+') 전공선택',cr:yAdv,tag:'선택',note:'심화 12학점',opts:missOpts(listIds(advT))});
    if(yOther>0)rows.push({n:'부전공: 상대 학과 전공필수·전공선택',cr:yOther,tag:'선택',note:'12학점 (전공기초 제외)',opts:missOpts(minorExtra.concat(otherTracks.reduce(function(a,t){return a.concat(listIds(t));},[])))});
    if(yAny>0)rows.push({n:'전공선택 (어느 전공과정이든 가능)',cr:yAny,tag:'선택',note:'일반학전공 탭의 전공선택 목록에서 고르세요'});
    return {sel:mSemOwn+mSemAdv+mTh+yOwn+yAdv+yOther+yAny,total:total,own:ownC,ownReq:ownReq,T:T,rows:rows};
  };
  const base=calcSel('none');
  const advRes=S.adv!=='none'?calcSel(S.adv):null;
  base.rows.forEach(function(r){gS.rows.push(r);});
  gS.rem=base.sel;
  const maRem=maBaseMiss+rqMiss+base.sel;

  /* ---------- 경찰학전공 36학점 ---------- */
  const gb=grp('po','전공기초 · 경찰 관계 형사법 (11학점)'),gr=grp('po','경찰학필수 (14학점)'),ge=grp('po','경찰학선택 (11학점)');
  const crimOk=PO_CRIM.some(cnt);
  const poBaseMiss=PO_BASE.reduce(function(s,id){return s+(cnt(id)?0:C[id].cr);},0)+(crimOk?0:2);
  PO_BASE.forEach(function(id){if(!cnt(id))row(gb,C[id].name,C[id].cr,'필수');});
  if(!crimOk)row(gb,'형법각론Ⅱ 또는 형사소송법Ⅱ',2,'택1',{opts:missOpts(PO_CRIM)});
  const poReqMiss=PO_REQ.reduce(function(s,id){return s+(cnt(id)?0:C[id].cr);},0);
  PO_REQ.forEach(function(id){if(!cnt(id))row(gr,C[id].name,C[id].cr,'필수');});
  const pickN=PO_PICK.filter(cnt).length;
  const pickMiss=Math.max(0,3-pickN)*2;
  if(pickMiss>0)row(gr,'4과목 중 3과목 이수',pickMiss,'택3',{note:(3-pickN)+'과목 더 필요',opts:missOpts(PO_PICK)});
  const poElecE=sumIds(PO_ELEC)+(xs.po_elec||0);
  const poElecMiss=Math.max(0,11-poElecE);
  if(poElecMiss>0)row(ge,'경찰학선택',poElecMiss,'선택',{note:'11학점 이상 필요',opts:missOpts(PO_ELEC)});
  gb.rem=poBaseMiss;gr.rem=poReqMiss+pickMiss;ge.rem=poElecMiss;
  const poRem=poBaseMiss+poReqMiss+pickMiss+poElecMiss;

  /* ---------- 부호지정과목: H 또는 G코드 2학점 (82학점 외 추가 이수) ---------- */
  const gH=grp('hg','부호지정과목 (H 또는 G코드)');
  const surplus=Math.max(0,base.total-6);
  const hgSel=Math.min(sumIds(HG_SEL)+codeSel,surplus);
  const hgGy=(cnt(GY_G)?C[GY_G].cr:0)+codeGy;
  const hgHave=hgGy+hgSel;
  const hgRem=Math.max(0,2-hgHave);
  if(hgRem>0)row(gH,'H 또는 G코드 과목',hgRem,'필수',{note:'82학점 외에 추가로 이수 (졸업요구학점 84학점)',opts:[GY_G].concat(HG_SEL).filter(function(id){return !cnt(id);}).map(function(id){return {n:C[id].name+(C[id].tags.indexOf('H')>=0?' (H코드)':' (G코드)'),cr:C[id].cr};})});
  gH.rem=hgRem;

  /* ---------- 선택심화과정 (추가 이수, 졸업 필수 아님) ---------- */
  const MODE={major:'심화전공',minor:'부전공',track:'융복합트랙'};
  let advOut=null;
  if(advRes){
    const gA=grp('adv',MODE[S.adv]+' 이수 조건');
    advRes.rows.forEach(function(r){gA.rows.push(r);});
    gA.rem=advRes.sel;
    advOut={mode:S.adv,name:MODE[S.adv],t:advRes.T,rem:advRes.sel,own:advRes.own,ownReq:advRes.ownReq};
  }
  /* 융복합트랙 지정 과목 */
  if(tkrAdv){
    const gt=grp('tk',tkrAdv.t.name+' 트랙');
    tkrAdv.reqRows.forEach(function(r){gt.rows.push(r);});
    if(tkrAdv.extraGap>0)gt.rows.push({n:'지정 과목 중 추가 이수',cr:tkrAdv.extraGap,tag:'선택',note:'트랙 학점 계 '+tkrAdv.need+'학점 중 부족분',opts:tkrAdv.optLeft});
    gt.rem=tkrAdv.rem;
  }

  const total=gyRem+maRem+poRem+hgRem;
  return {inc:inc,
    gy:{t:4,rem:gyRem},
    ma:{t:42,rem:maRem,base:maBaseMiss,req:rqMiss,sel:base.sel,selT:6,own:base.own,total:base.total,dept:dept},
    po:{t:36,rem:poRem},
    hg:{t:2,rem:hgRem,have:hgHave},
    adv:advOut,
    tk:tkrAdv?{name:tkrAdv.t.name,need:tkrAdv.need,earned:tkrAdv.earned,rem:tkrAdv.rem}:null,
    total:total,target:84,G:G};
}

  const t=ev.target.closest('[data-act]');if(!t)return;
  const act=t.getAttribute('data-act');
  if(act==='st'){S.st[t.getAttribute('data-id')]=+t.getAttribute('data-v');}
  else if(act==='tab'){clearQ();S.ui.tab=t.getAttribute('data-tab');saveState();renderAll();window.scrollTo({top:0});return;}
  else if(act==='qclear'){clearQ();}
  else if(act==='qf'){QF=t.getAttribute('data-v');}
  else if(act==='addx'){
    const name=document.getElementById('x_name').value.trim();
    const cr=Math.max(0,Math.min(20,+document.getElementById('x_cr').value||0));
    if(!cr){document.getElementById('x_cr').focus();return;}
    S.extras.push({id:S.nid++,name:name,cr:cr,bucket:document.getElementById('x_bucket').value,code:document.getElementById('x_code').value,status:+document.getElementById('x_status').value});
  }
  else if(act==='xst'){const e=S.extras.filter(function(x){return x.id==t.getAttribute('data-id');})[0];if(e)e.status=+t.getAttribute('data-v');}
  else if(act==='delx'){S.extras=S.extras.filter(function(x){return x.id!=t.getAttribute('data-id');});}
  else if(act==='nc'){S.nc[t.getAttribute('data-k')]=t.checked;}
  else if(act==='inc'){S.inc=t.checked;}
  else if(act==='export'){document.getElementById('bk').value=JSON.stringify(S);return;}
  else if(act==='import'){
    try{const o=JSON.parse(document.getElementById('bk').value);S=Object.assign(defState(),o);S.ui=Object.assign({tab:'start',open:{}},o.ui||{});}
    catch(e){alert('불러오지 못했습니다. 내보내기로 만든 내용을 그대로 붙여넣어 주세요.');return;}
  }
  else if(act==='reset'){if(!confirm('입력한 내용을 모두 지울까요?'))return;S=defState();}
  saveState();renderAll();
}
function onChange(ev){
  const t=ev.target;const k=t.getAttribute&&t.getAttribute('data-set');
  if(!k)return;
  if(k==='dept'){S.deptSet=true;S.dept=t.value;S.track=Object.keys(TR).filter(function(x){return TR[x].dept===S.dept;})[0];S.advTrack=S.track;}
  else if(k==='track'){S.track=t.value;S.advTrack=t.value;}
  else if(k==='adv'){S.adv=t.value;if(S.adv==='major')S.advTrack=S.track;}
  else if(k==='advTrack'){S.advTrack=t.value;}
  else if(k==='tkId'){S.tkId=t.value;}
  else if(k==='sem'){S.sem=Math.max(1,Math.min(4,+t.value||1));}
  else if(k==='vol'||k==='warn'){S[k]=Math.max(0,+t.value||0);}
  saveState();renderAll();
}
function boot(){
  loadState();
  if(!TR[S.track]||TR[S.track].dept!==S.dept)S.track=Object.keys(TR).filter(function(x){return TR[x].dept===S.dept;})[0];
  document.addEventListener('click',onClick);
  document.addEventListener('change',onChange);
  document.addEventListener('toggle',onToggle,true);
  document.addEventListener('input',onInput);
  document.addEventListener('keydown',onKey);
  renderAll();
}
if(typeof document!=='undefined'&&document.getElementById('panels'))boot();

function tagHtml(c){
  return c.tags.map(function(t){
    if(t==='R'||t==='H'||t==='G')return '<span class="tag '+t+'" title="'+t+'코드 과목">'+t+'코드</span>';
    return '<span class="tag">'+esc(t)+'</span>';
  }).join('');
}

function segHtml(id,v,label){

  return '<div class="seg" role="group" aria-label="'+esc(label)+' 이수 상태">'+b(0,'미이수')+b(1,'이수')+b(2,'수강 중')+'</div>';

function rowGen(id,name,cr,tags){

  return '<div class="crs s'+v+'"><div class="nm">'+esc(name)+tags+'<span class="c">'+cr+'학점</span></div><div class="cr num">'+cr+'학점</div>'+segHtml(id,v,name)+'</div>';

function rowHtml(id){const c=C[id];return rowGen(id,c.name,c.cr,tagHtml(c));}

function rowsHtml(ids){return ids.map(rowHtml).join('');}

function okNo(rem){return rem<=0?'<span class="pill ok">충족</span>':'<span class="pill no">'+rem+'학점 남음</span>';}

function detailsHtml(key,title,meta,inner,openDefault){
  const open=(key in S.ui.open)?S.ui.open[key]:!!openDefault;
  return '<details class="grp" data-k="'+key+'"'+(open?' open':'')+'><summary>'+title+(meta?' <span class="pill">'+meta+'</span>':'')+'</summary>'+inner+'</details>';

function pickBox(label,ids){return '<div class="pickbox"><div class="lab">'+esc(label)+'</div>'+rowsHtml(ids)+'</div>';}

function ledgerRow(name,sub,d,i){
  const t=Math.max(1,d.t);
  const done=Math.max(0,t-d.rem),prog=Math.max(0,d.rem-i.rem);
  const pd=Math.min(100,done/t*100),pp=Math.min(100-pd,prog/t*100);
  return '<div class="lrow"><div class="nm">'+name+'<small>'+sub+'</small></div>'+
    '<div class="track" role="img" aria-label="'+name+' 진행: 이수 '+done+'학점, 수강 중 '+prog+'학점, 남음 '+i.rem+'학점"><i class="d" style="width:'+pd+'%"></i><i class="p" style="width:'+pp+'%"></i></div>'+
    '<div class="rt num"><b>'+d.rem+'</b> 남음 <br>'+(prog>0?'수강 중 반영 시 '+i.rem:'요구 '+d.t+'학점')+'</div></div>';
}

function tabsList(){
  const t=[['start','설정'],['gy','교양'],['ma','일반학전공'],['po','경찰학전공']];
  if(S.adv==='track')t.push(['tk','융복합트랙']);
  t.push(['xt','인정학점'],['nc','졸업요건(학점 외)'],['rem','남은 과목']);
  return t;
}

function renderTabs(R){
  const tabsEl=document.getElementById('tabs');
  if(tabsEl.style)tabsEl.style.display=Q?'none':'';

  const r=S.inc?R.i:R.d;

    return '<button type="button" role="tab" data-act="tab" data-tab="'+t[0]+'" aria-selected="'+(S.ui.tab===t[0])+'">'+t[1]+badge+'</button>';
  }).join('');
}

function trackCalc(cnt,dept,otherReq){
  const t=TRK[S.tkId];if(!t)return null;
  let earned=0,missing=0,extra=0;const seen={};
  const reqRows=[],optLeft=[];
  const countExtra=function(o){if(seen[o.id])return;seen[o.id]=1;if(o.isTk||otherReq.indexOf(o.ref)>=0)extra+=o.cr;};
  t.rows.forEach(function(rw){
    if(rw.dept&&rw.dept!==dept)return;
    if(rw.pick){
      const done=rw.opts.filter(function(o){return cnt(o.id);});
      const left=rw.opts.filter(function(o){return !cnt(o.id);}).map(function(o){return {n:o.n,cr:o.cr};});
      done.slice(0,rw.pick).forEach(function(o){earned+=o.cr;countExtra(o);});
      const sh=Math.max(0,rw.pick-done.length);
      if(rw.req&&sh>0){
        const mc=Math.min.apply(null,rw.opts.map(function(o){return o.cr;}));
        missing+=sh*mc;
        reqRows.push({n:rw.label,cr:sh*mc,tag:'택'+rw.pick,note:sh+'과목 더 필요',opts:left});
      }else if(!rw.req&&sh>0){left.forEach(function(o){optLeft.push(o);});}
    }else{
      if(cnt(rw.id)){earned+=rw.cr;countExtra(rw);}
      else if(rw.req){missing+=rw.cr;reqRows.push({n:rw.n,cr:rw.cr,tag:'필수'});}
      else optLeft.push({n:rw.n,cr:rw.cr});
    }
  });
  const gap=Math.max(0,t.need-earned);
  const rem=Math.max(missing,gap);
  return {t:t,earned:earned,need:t.need,rem:rem,missing:missing,extraGap:Math.max(0,gap-missing),reqRows:reqRows,optLeft:optLeft,extra:extra};
}

function trackRowsHtml(t,dept){
  let h='';
  t.rows.forEach(function(rw){
    if(rw.dept&&rw.dept!==dept)return;
    if(rw.pick){
      let inner='<div class="pickbox"><div class="lab">'+esc(rw.label)+(rw.req?' (필수 선택)':' (선택)')+'</div>';
      rw.opts.forEach(function(o){inner+=rowGen(o.id,o.n,o.cr,trackTags(o,null));});
      h+=inner+'</div>';
    }else{
      h+=rowGen(rw.id,rw.n,rw.cr,trackTags(rw,rw));
    }
  });
  return h;
}

function trackTags(o,rw){
  let s='';
  if(rw&&rw.req)s+='<span class="tag">'+esc(rw.tag||'필수')+'</span>';
  if(o.y)s+='<span class="tag">'+esc(o.y)+'학년</span>';
  if(o.isTk)s+='<span class="tag">트랙 전용</span>';
  return s;
}

  TRACKS.forEach(function(t){
    h+='<label class="opt'+(S.tkId===t.id?' on':'')+'"><input type="radio" name="tkId" data-set="tkId" value="'+t.id+'"'+(S.tkId===t.id?' checked':'')+'><span>'+esc(t.name)+(t.isNew?' <span class="tag new">신설</span>':'')+'<small>담당 '+esc(t.prof)+' 교수</small></span></label>';
  });
  h+='</div></div>';
  const t=TRK[S.tkId];
  if(t&&r.tk){
    h+='<div class="card"><h2>'+esc(t.name)+' 트랙 '+(r.tk.rem<=0?'<span class="pill ok">충족</span>':'<span class="pill no">'+r.tk.rem+'학점 남음</span>')+'<span class="tg">이수 '+r.tk.earned+' / 학점 계 '+r.tk.need+(/12|14/.test(String(t.need))&&(t.id==='forensic'||t.id==='ds')?' 이상':'')+'</span></h2>';
    h+='<p class="note">'+esc(t.desc)+'</p>';
    h+='<h3>지정 과목 <span class="need">학점·권장 학년은 트랙 안내 표 기준</span></h3>'+trackRowsHtml(t,dept);
    if(t.notes.length)h+='<ul class="bul">'+t.notes.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
    h+='<h3>논문 대체 활동 <span class="need">다음 중 택 1 · 논문활동 Ⅰ·Ⅱ 2학점으로 인정</span></h3><ul class="bul">'+t.thesis.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
    h+='<label class="ncl"><input type="checkbox" data-act="nc" data-k="tkth"'+(S.nc.tkth?' checked':'')+'><div><div class="tt">논문 대체 활동을 마쳤습니다</div><div class="ss">졸업요건 탭의 체크 항목에도 반영됩니다. 결과보고서는 4학년 2학기 11월 말까지 제출합니다.</div></div></label>';
    h+='<p class="note">트랙 지정 과목 중 일반 교과목 목록에 없는 과목(트랙 전용, 편입 교양에 없는 과목 포함)은 전공선택 학점으로 계산합니다. 전공기초·경찰학선택 과목은 해당 영역 학점으로 계산합니다. 이 구분은 안내 문서에 명시가 없는 가정입니다.</p></div>';
  }else{
    h+='<div class="card"><p class="note">위에서 트랙을 선택하면 지정 과목, 남은 학점, 논문 대체 활동이 표시됩니다.</p></div>';
  }
  return h;
}

function chipsHtml(opts){
  if(!opts||!opts.length)return '';
  const inner='<div class="chips">'+opts.map(function(o){return '<span class="chip">'+esc(o.n)+(o.cr?' '+o.cr+'학점':'')+'</span>';}).join('')+'</div>';
  if(opts.length>8)return '<details class="cand"><summary>고를 수 있는 과목 '+opts.length+'개 보기</summary>'+inner+'</details>';
  return '<div class="note" style="margin:6px 0 0">고를 수 있는 과목</div>'+inner;
}

function tagCls(t){
  if(t==='필수')return 'req';
  if(t==='졸업요건'||t==='특례')return 'ok';
  if(/^택/.test(t)||t==='선택')return 'pk';
  return '';
}

function remRow(x){
  const cr=x.cr>0?x.cr+'학점':(x.cr<0?x.cr+'학점':'');
  return '<div class="rr"><span class="tg '+tagCls(x.tag)+'">'+esc(x.tag||'')+'</span><div><div class="nm">'+esc(x.n)+'</div>'+(x.note?'<div class="nt">'+esc(x.note)+'</div>':'')+chipsHtml(x.opts)+'</div><div class="cr num'+(x.cr<0?' neg':'')+'">'+cr+'</div></div>';
}

function remCard(title,sub,total,groups,extraNote){
  const gs=groups.filter(function(g){return g.rows.length>0;});
  let h='<div class="card"><div class="rc-h"><h2>'+esc(title)+(sub?' <span class="tg">'+esc(sub)+'</span>':'')+'</h2><div class="rc-n num'+(total<=0?' z':'')+'">'+(total<=0?'<b>충족</b>':'남은 학점 <b>'+total+'</b>학점')+'</div></div>';
  if(extraNote)h+='<p class="note">'+esc(extraNote)+'</p>';
  if(total<=0&&!gs.length)h+='<div class="done-msg">이 영역은 모두 채웠습니다.</div>';
  gs.forEach(function(g){
    h+='<div class="rg"><div class="rg-h"><span class="t">'+esc(g.t)+'</span><span class="s num">'+(g.rem>0?g.rem+'학점 남음':'')+'</span></div>'+g.rows.map(remRow).join('')+'</div>';
  });
  return h+'</div>';
}

function hl(name,q){
  const i=q?name.toLowerCase().indexOf(q.toLowerCase()):-1;
  if(i<0)return esc(name);
  return esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+q.length))+'</mark>'+esc(name.slice(i+q.length));
}

function resRow(it,q){
  const v=S.st[it.id]|0;
  const cat=it.cat+(it.mem?(it.cat?' · ':'')+it.mem:'');
  return '<div class="crs s'+v+'"><div class="nm">'+hl(it.name,q)+tagHtml({tags:it.tags})+'<span class="c">'+it.cr+'학점</span><div class="cat">'+esc(cat)+'</div></div><div class="cr num">'+it.cr+'학점</div>'+segHtml(it.id,v,it.name)+'</div>';
}

function renderPanels(R){
  const map={start:panelStart,gy:panelGy,ma:panelMa,po:panelPo,tk:panelTk,xt:panelXt,nc:panelNc,rem:panelRem};
  fixUi();
  if(Q){document.getElementById('panels').innerHTML=panelSearch(R);return;}
  const t=S.ui.tab;
  document.getElementById('panels').innerHTML='<div class="panel on" role="tabpanel">'+(map[t]||panelStart)(R)+'</div>';
}

function renderAll(){
  const R={d:compute(S,false),i:compute(S,true)};
  renderBar(R);renderHero(R);renderTabs(R);renderPanels(R);
}

function onToggle(ev){
  const d=ev.target;
  if(d&&d.tagName==='DETAILS'&&d.getAttribute('data-k')){S.ui.open[d.getAttribute('data-k')]=d.open;saveState();}
}

function clearQ(){Q='';QF='all';const q=document.getElementById('q');if(q)q.value='';}

function onInput(ev){const t=ev.target;if(t&&t.id==='q'){Q=t.value.trim();if(!Q)QF='all';renderAll();}}

function onKey(ev){if(ev.key==='Escape'&&Q){clearQ();renderAll();}}
